# dsh bundle layer: mount the Session Assistant plugin (dsh/index.js via the
# package root export). The host exposes settings routes and, when selected,
# initializes authenticated OpenAI WebRTC or Doubao Duplex WebSocket
# deliberation/drafting sessions from registered model and credential references.
- insert:
    - id: dsh-session-assistant
      name: 'dsh-session-assistant'
